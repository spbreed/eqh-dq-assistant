      gaps: {table: raw_payer_va1_gaps, format: csv, cadence_hours: 168}
      pharmacy: {table: raw_va1_rx_claims, format: csv, cadence_hours: 24}

# Non-payer feeds
shared_feeds:
  hie_adt: {cadence_hours: 24}                     # one raw table per state HIE (states.*.hie_feed)
  ehr_labs: {table: raw_ehr_ccda_labs, cadence_hours: 24}
  careempower: {table: raw_careempower_ops, cadence_hours: 24}   # CHW, SDoH, HaH activity export
